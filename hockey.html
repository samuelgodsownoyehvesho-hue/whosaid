#flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(26px,7vw,44px)/1 "Bungee","Arial Black",Impact,sans-serif;background:var(--ink);color:var(--y);border:3px solid var(--y);border-radius:16px;padding:14px 24px;white-space:nowrap;opacity:0;pointer-events:none;z-index:4}
#flash.on{animation:pop 1.05s ease-out both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
@media (max-width:640px){header{height:44px;padding:4px 12px}.score{min-width:70px}.score b{font-size:22px}footer{height:48px}footer span{display:none}canvas{border-radius:20px}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:fade 1.05s both}.score b.pop{animation:none}.btn{transition:none}}

<script>
(()=>{
"use strict";
const W=400,H=700,M=16,CW=W+2*M,CH=H+2*M,PR=18,KR=32,GW=170,GL=(W-GW)/2,GR=GL+GW,POST=7,WIN=7,MAXV=1400,DEF=105,HOME=H-110;
const SB_URL="https://pzjmskbhlkjnhncwmtcz.supabase.co",SB_KEY="sb_publishable_2tNxqr58Tck9QYllHqoJqA_mpNk4Hyk";
const $=s=>document.querySelector(s);
const cv=$("#cv"),cx=cv.getContext("2d"),stage=$("#stage"),stat=document.createElement("canvas");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const LV={easy:{sp:520,err:46,atk:320},medium:{sp:820,err:20,atk:620},hard:{sp:1150,err:6,atk:900}};
let level="medium",state="menu",prev="menu",timer=0,muted=false,shake=0,last=0,acc=0,stall=0,aiOff=0,parts=[],mode="solo",ev=0,lastEv=0,snapT=0;
const sc={me:0,ai:0};
const puck={x:W/2,y:H/2,vx:0,vy:0,tr:[],hit:0};
const me={x:W/2,y:HOME,vx:0,vy:0,dir:-1},ai={x:W/2,y:DEF,vx:0,vy:0,dir:1};
const gpuck={x:W/2,y:H/2,vx:0,vy:0,tr:[]},gme={x:W/2,y:HOME,vx:0,vy:0},gopp={x:W/2,y:DEF,tx:W/2,ty:DEF,vx:0,vy:0};
const snap={x:W/2,y:H/2,vx:0,vy:0},gt={x:W/2,y:DEF};
let V={me,opp:ai,puck};
const inp={x:W/2,y:HOME},keys={};
const P={menu:$("#menu"),net:$("#net"),pause:$("#pause"),over:$("#over")};
const R=Math.round,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- audio ---------- */
let ac=null;
function snd(f,d,t,v){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=t||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(v||.12,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}
function hs(f,d,t,v){ev++;snd(f,d,t,v)}

/* ---------- helpers ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function refl(x){const lo=PR,w=W-2*PR;let m=((x-lo)%(2*w)+2*w)%(2*w);return lo+(m>w?2*w-m:m)}
function burst(x,y,n,col,sp){
  if(RM)n=Math.min(n,3);
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.35+Math.random()*.65);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col})}
  if(parts.length>140)parts.splice(0,parts.length-140);
}
function flash(t){const f=$("#flash");f.textContent=t;f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}
function upd(bump){
  $("#sa").textContent=sc.ai;$("#sm").textContent=sc.me;
  if(bump){const e=$(bump);e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
}
function show(k){
  for(const n in P)P[n].hidden=n!==k;
  cv.classList.toggle("play",!k);
  if(k){const b=P[k].querySelector(".go");if(b)b.focus({preventScroll:true})}
}
const opp=()=>mode==="solo"?"CPU":"Friend";
function setMode(m){
  mode=m;$("#ln").textContent=opp();$("#pbtn").hidden=m!=="solo";
  V=m==="guest"?{me:gme,opp:gopp,puck:gpuck}:{me,opp:ai,puck};
  sc.me=sc.ai=0;upd();
}
function netPanel(title,text,btns){
  $("#netT").textContent=title;$("#netP").textContent=text;$("#netN").textContent="";
  const b=$("#netB");b.textContent="";
  btns.forEach(([t,fn,ghost],i)=>{const e=document.createElement("button");e.className="btn"+(ghost?" ghost":"")+(i===0?" go":"");e.textContent=t;e.onclick=fn;b.appendChild(e)});
  show("net");
}

/* ---------- game flow ---------- */
function serve(toMe){
  puck.x=W/2;puck.y=toMe?H*.66:H*.34;puck.vx=puck.vy=0;puck.tr.length=0;
  state="serve";timer=1.1;stall=0;acc=0;
}
function newGame(){
  sc.me=sc.ai=0;upd();
  me.x=inp.x=W/2;me.y=inp.y=HOME;ai.x=gt.x=W/2;ai.y=gt.y=DEF;parts=[];
  show(null);flash("Ready");serve(true);
  if(mode==="host")sendState(performance.now(),true);
}
function overUI(){
  $("#overT").textContent=sc.me>sc.ai?"You win":opp()+" wins";
  $("#overS").textContent="Final score "+sc.me+" – "+sc.ai;
  $("#again").hidden=mode==="guest";
  $("#again").textContent=mode==="host"?"Rematch":"Play again";
  $("#change").textContent=mode==="solo"?"Change difficulty":"Leave";
  $("#overN").textContent=mode==="guest"?"Waiting for the host to start a rematch.":"";
  show("over");
}
function goal(byMe){
  if(byMe)sc.me++;else sc.ai++;
  upd(byMe?"#sm":"#sa");
  burst(puck.x,byMe?0:H,26,byMe?"#3D5BFF":"#FF4F3A",420);
  if(!RM)shake=14;
  snd(byMe?660:180,.45,"triangle",.16);
  if(sc.me>=WIN||sc.ai>=WIN){
    state="over";puck.x=W/2;puck.y=H/2;puck.vx=puck.vy=0;puck.tr.length=0;
    setTimeout(()=>{if(state==="over")overUI()},650);
  }else{
    flash(byMe?"You score":opp()+" scores");serve(!byMe);
  }
  if(mode==="host")sendState(performance.now(),true);
}
function pause(){if(mode==="solo"&&(state==="play"||state==="serve")){prev=state;state="paused";show("pause")}}
function resume(){if(state==="paused"){state=prev;show(null);acc=0;last=performance.now()}}

/* ---------- physics (solo + host) ---------- */
function clampPad(p,isMe){
  p.x=clamp(p.x,KR,W-KR);
  p.y=isMe?clamp(p.y,H/2+KR,H-KR):clamp(p.y,KR,H/2-KR);
}
function drive(p,tx,ty,sp,dt,isMe){
  let dx=tx-p.x,dy=ty-p.y;const d=Math.hypot(dx,dy),s=sp*dt;
  if(d>s){dx*=s/d;dy*=s/d}
  const ox=p.x,oy=p.y;p.x+=dx;p.y+=dy;clampPad(p,isMe);
  p.vx=(p.x-ox)/dt;p.vy=(p.y-oy)/dt;
}
function post(px,py){
  const dx=puck.x-px,dy=puck.y-py,d=Math.hypot(dx,dy),m=PR+POST;
  if(d<m&&d>1e-4){
    const nx=dx/d,ny=dy/d;puck.x=px+nx*m;puck.y=py+ny*m;
    const vn=puck.vx*nx+puck.vy*ny;
    if(vn<0){puck.vx-=1.9*vn*nx;puck.vy-=1.9*vn*ny;hs(520,.06,"square",.05)}
  }
}
function padHit(p,push,col){
  let dx=puck.x-p.x,dy=puck.y-p.y,d=Math.hypot(dx,dy);const m=KR+PR;
  if(d>=m)return;
  let nx,ny;
  if(d<1e-3){nx=0;ny=p.dir;d=0}else{nx=dx/d;ny=dy/d}
  if(!push){
    puck.x=p.x+nx*m;puck.y=p.y+ny*m;
    const vn=(puck.vx-p.vx)*nx+(puck.vy-p.vy)*ny;
    if(vn<0){
      const j=-1.7*vn;puck.vx+=j*nx;puck.vy+=j*ny;
      if(j>70&&puck.hit<=0){
        puck.hit=.07;hs(230+Math.min(j,900)*.25,.09,"triangle",.13);
        burst(puck.x-nx*PR,puck.y-ny*PR,6,col,260);
        if(p===me)aiOff=(Math.random()*2-1)*LV[level].err;
      }
    }
  }else{
    const o=m-d;p.x-=nx*o;p.y-=ny*o;clampPad(p,p===me);
  }
}
function aiTarget(){
  const L=LV[level],p=puck,sp=Math.hypot(p.vx,p.vy);
  if(state==="serve")return{x:W/2,y:DEF};
  if(p.y<H/2+30&&sp<L.atk){
    const gx=W/2-p.x,gy=H-p.y,gl=Math.hypot(gx,gy)||1;
    if(ai.y<p.y-6)return{x:p.x+gx/gl*30,y:p.y+gy/gl*30};
    const sx=p.x>W/2?1:-1;
    return{x:p.x+sx*(KR+PR+22),y:Math.max(KR,p.y-70)};
  }
  if(p.vy<-25){const t=(p.y-DEF)/-p.vy;return{x:refl(p.x+p.vx*t)+aiOff,y:DEF}}
  return{x:W/2+(p.x-W/2)*.45,y:DEF};
}
function keyMove(dt){
  if(keys.arrowleft||keys.a)inp.x-=700*dt;
  if(keys.arrowright||keys.d)inp.x+=700*dt;
  if(keys.arrowup||keys.w)inp.y-=700*dt;
  if(keys.arrowdown||keys.s)inp.y+=700*dt;
  inp.x=clamp(inp.x,0,W);inp.y=clamp(inp.y,0,H);
}
function step(dt){
  keyMove(dt);
  const net=mode==="host";
  drive(me,inp.x,inp.y,2200,dt,true);
  if(state==="serve"){
    timer-=dt;
    if(net)drive(ai,gt.x,gt.y,2200,dt,false);else drive(ai,W/2,DEF,700,dt,false);
    if(timer<=0)state="play";
    return;
  }
  if(net)drive(ai,gt.x,gt.y,2200,dt,false);
  else{const a=aiTarget();drive(ai,a.x,a.y,LV[level].sp,dt,false)}
  puck.hit-=dt;
  puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;
  const k=Math.max(0,1-.12*dt);puck.vx*=k;puck.vy*=k;
  post(GL,0);post(GR,0);post(GL,H);post(GR,H);
  padHit(me,false,"#3D5BFF");padHit(ai,false,"#FF4F3A");
  if(puck.x<PR){puck.x=PR;puck.vx=Math.abs(puck.vx)*.96;hs(330,.05,"square",.05)}
  else if(puck.x>W-PR){puck.x=W-PR;puck.vx=-Math.abs(puck.vx)*.96;hs(330,.05,"square",.05)}
  if(puck.x<GL||puck.x>GR){
    if(puck.y<PR){puck.y=PR;puck.vy=Math.abs(puck.vy)*.96;hs(330,.05,"square",.05)}
    else if(puck.y>H-PR){puck.y=H-PR;puck.vy=-Math.abs(puck.vy)*.96;hs(330,.05,"square",.05)}
  }
  padHit(me,true);padHit(ai,true);
  const sp=Math.hypot(puck.vx,puck.vy);
  if(sp>MAXV){puck.vx*=MAXV/sp;puck.vy*=MAXV/sp}
  if(puck.y<-PR-4){goal(true);return}
  if(puck.y>H+PR+4){goal(false);return}
  if(sp<12){stall+=dt;if(stall>3){puck.vy=puck.y>H/2?-200:200;puck.vx=(W/2-puck.x)*.5;stall=0}}else stall=0;
}

/* ---------- online (Supabase broadcast channel) ---------- */
let sb=null,ch=null,peer=null,joined=false,code="",lastSeen=0,lastSend=0,lastAim=0,lastJoin=0,joinStart=0;
const cid=Math.random().toString(36).slice(2,8);
function loadSB(){
  return new Promise((res,rej)=>{
    if(window.supabase)return res();
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0";
    s.onload=res;s.onerror=()=>rej(new Error("Could not load the online library. Check your connection."));
    document.head.appendChild(s);
  });
}
async function connect(c){
  await loadSB();
  sb=sb||window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:60}}});
  ch=sb.channel("hk-"+c,{config:{broadcast:{self:false}}});
  ch.on("broadcast",{event:"m"},e=>onNet(e.payload));
  await new Promise((res,rej)=>{ch.subscribe(st=>{if(st==="SUBSCRIBED")res();else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")rej(new Error("Could not connect ("+st+")."))})});
}
function tx(o){if(ch)ch.send({type:"broadcast",event:"m",payload:{c:cid,...o}})}
function leaveOnline(msg){
  if(ch){try{tx({k:"bye"})}catch(_){}try{sb.removeChannel(ch)}catch(_){}}
  ch=null;peer=null;joined=false;code="";state="menu";setMode("solo");
  if(location.pathname.startsWith("/h/"))history.replaceState(null,"","/hockey.html");
  $("#menuMsg").textContent=msg||"";show("menu");
}
async function hostGame(){
  setMode("host");state="wait";peer=null;
  netPanel("Connecting","Setting up your match.",[["Cancel",()=>leaveOnline(),1]]);
  code=Array.from({length:5},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
  try{await connect(code)}catch(e){return leaveOnline(e.message)}
  lastSeen=performance.now();hostLobby();
}
function hostLobby(msg){
  const url=location.origin+"/h/"+code,b=[["Share link",()=>shareLink(url)]];
  if(peer)b.unshift(["Start match",hostStart]);
  b.push(["Cancel",()=>leaveOnline(),1]);
  netPanel(peer?"Friend joined":"Invite a friend",peer?"Start when you are ready.":url,b);
  if(msg)$("#netN").textContent=msg;
  if(!peer&&!msg)$("#netN").textContent="Send this link. Your friend joins by opening it.";
}
async function shareLink(url){
  if(navigator.share){try{await navigator.share({title:"Air hockey",text:"Let’s play air hockey. Open the link to join my match.",url})}catch(_){}return}
  try{await navigator.clipboard.writeText(url);$("#netN").textContent="Link copied."}catch(_){$("#netN").textContent="Copy the link above and send it."}
}
function hostStart(){if(mode==="host"&&peer)newGame()}
function peerLost(){peer=null;state="wait";hostLobby("Your friend disconnected. Share the link again.")}
async function joinGame(c){
  setMode("guest");code=c;state="wait";joined=false;
  netPanel("Connecting","Joining the match.",[["Leave",()=>leaveOnline(),1]]);
  try{await connect(c)}catch(e){return leaveOnline(e.message)}
  joinStart=lastJoin=lastSeen=performance.now();tx({k:"join"});
}
function guestLobby(){netPanel("Joined","Waiting for the host to start the match.",[["Leave",()=>leaveOnline(),1]])}
function sendState(now,force){
  const live=state==="serve"||state==="play";
  if(!force&&now-lastSend<(live?33:500))return;
  lastSend=now;
  tx({k:"s",z:{wait:"w",serve:"s",play:"p",over:"o"}[state]||"w",s:[sc.me,sc.ai],t:R(Math.max(0,timer)*1000),e:ev,
    p:[R(puck.x),R(puck.y),R(puck.vx),R(puck.vy)],h:[R(me.x),R(me.y)]});
}
function netBeat(now){
  if(!ch)return;
  if(mode==="host"){
    if(peer&&now-lastSeen>6000)return peerLost();
    if(peer)sendState(now);
  }else if(mode==="guest"){
    if(!joined){
      if(now-lastJoin>1500){lastJoin=now;tx({k:"join"})}
      if(now-joinStart>12000)leaveOnline("Could not reach the host. Check the link and try again.");
      return;
    }
    if(now-lastSeen>6000)return leaveOnline("The host disconnected.");
    const live=state==="serve"||state==="play";
    if(now-lastAim>(live?33:1000)){lastAim=now;tx({k:"aim",x:R(inp.x),y:R(inp.y)})}
  }
}
function onNet(m){
  if(!m||m.c===cid)return;
  const now=performance.now();
  if(mode==="host"){
    if(m.k==="join"){
      if(peer&&peer!==m.c&&now-lastSeen<6000)return tx({k:"full",to:m.c});
      if(peer!==m.c){peer=m.c;if(state!=="wait")state="wait"}
      lastSeen=now;tx({k:"welcome",to:m.c});
      if(state==="wait")hostLobby();
    }else if(m.c===peer){
      lastSeen=now;
      if(m.k==="aim"){gt.x=W-clamp(+m.x||0,KR,W-KR);gt.y=H-clamp(+m.y||0,H/2+KR,H-KR)}
      else if(m.k==="bye")peerLost();
    }
  }else if(mode==="guest"){
    if(m.to&&m.to!==cid)return;
    if(m.k==="welcome"){joined=true;lastSeen=now;if(state==="wait")guestLobby()}
    else if(m.k==="full")leaveOnline("This match already has two players.");
    else if(joined){
      lastSeen=now;
      if(m.k==="s")applyState(m);
      else if(m.k==="bye")leaveOnline("The host left.");
    }
  }
}
function applyState(m){
  if(!Array.isArray(m.p)||!Array.isArray(m.h)||!Array.isArray(m.s))return;
  const now=performance.now(),st={w:"wait",s:"serve",p:"play",o:"over"}[m.z]||"wait";
  const mine=+m.s[1]||0,theirs=+m.s[0]||0,won=mine>sc.me,lost=theirs>sc.ai;
  snap.x=W-m.p[0];snap.y=H-m.p[1];snap.vx=-m.p[2];snap.vy=-m.p[3];snapT=now;
  gopp.tx=W-m.h[0];gopp.ty=H-m.h[1];
  timer=(+m.t||0)/1000;
  if(m.e!==lastEv){lastEv=m.e;snd(300,.05,"triangle",.07)}
  sc.me=mine;sc.ai=theirs;
  if(won||lost){
    upd(won?"#sm":"#sa");burst(gpuck.x,won?0:H,26,won?"#3D5BFF":"#FF4F3A",420);
    if(!RM)shake=14;snd(won?660:180,.45,"triangle",.16);
    if(st!=="over")flash(won?"You score":"Friend scores");
  }else upd();
  if(st!==state){
    const was=state;state=st;
    if(st==="over")setTimeout(()=>{if(state==="over")overUI()},650);
    else if(st==="wait")guestLobby();
    else if(was==="wait"||was==="over"){
      show(null);gme.x=inp.x=W/2;gme.y=inp.y=HOME;gopp.x=gopp.tx;gopp.y=gopp.ty;gpuck.tr.length=0;flash("Ready");
    }
  }
}
function guestTick(dt){
  keyMove(dt);
  if(state==="serve"||state==="play")drive(gme,inp.x,inp.y,2200,dt,true);
  const k=1-Math.exp(-dt*22);
  gopp.x+=(gopp.tx-gopp.x)*k;gopp.y+=(gopp.ty-gopp.y)*k;
  const age=Math.min(.1,(performance.now()-snapT)/1000);
  const tx_=clamp(snap.x+snap.vx*age,PR,W-PR),ty_=snap.y+snap.vy*age;
  if(Math.hypot(tx_-gpuck.x,ty_-gpuck.y)>110){gpuck.x=tx_;gpuck.y=ty_}
  else{const kk=1-Math.exp(-dt*28);gpuck.x+=(tx_-gpuck.x)*kk;gpuck.y+=(ty_-gpuck.y)*kk}
  gpuck.vx=snap.vx;gpuck.vy=snap.vy;
  if(state==="serve")timer=Math.max(0,timer-dt);
}

/* ---------- rendering ---------- */
function buildStatic(){
  const s=cv.width/CW;stat.width=cv.width;stat.height=cv.height;
  const c=stat.getContext("2d");c.setTransform(s,0,0,s,0,0);
  let g=c.createLinearGradient(0,0,0,CH);g.addColorStop(0,"#2C3190");g.addColorStop(1,"#14173F");
  c.fillStyle=g;rr(c,0,0,CW,CH,22);c.fill();
  c.strokeStyle="rgba(255,255,255,.2)";c.lineWidth=2;rr(c,1,1,CW-2,CH-2,21);c.stroke();
  c.fillStyle="#070920";c.fillRect(M+GL,4,GW,M-4);c.fillRect(M+GL,M+H,GW,M-4);
  g=c.createRadialGradient(CW/2,CH/2,40,CW/2,CH/2,520);
  g.addColorStop(0,"#FFE866");g.addColorStop(.55,"#FFD60A");g.addColorStop(1,"#F0BC00");
  c.fillStyle=g;c.fillRect(M,M,W,H);
  c.fillStyle="rgba(122,80,0,.2)";
  for(let y=M+7,r=0;y<M+H;y+=14,r++)for(let x=M+7+(r%2)*7;x<M+W;x+=14){c.beginPath();c.arc(x,y,1.3,0,6.283);c.fill()}
  c.strokeStyle="rgba(23,26,82,.42)";c.fillStyle="rgba(23,26,82,.42)";c.lineWidth=4;
  c.beginPath();c.moveTo(M,M+H/2);c.lineTo(M+W,M+H/2);c.stroke();
  c.beginPath();c.arc(CW/2,CH/2,64,0,6.283);c.stroke();
  c.beginPath();c.arc(CW/2,CH/2,7,0,6.283);c.fill();
  c.beginPath();c.arc(CW/2,M,96,0,Math.PI);c.stroke();
  c.beginPath();c.arc(CW/2,M+H,96,Math.PI,6.283);c.stroke();
  const rail=(x0,y0,x1,y1,w,h)=>{const q=c.createLinearGradient(x0,y0,x1,y1);q.addColorStop(0,"rgba(110,70,0,.38)");q.addColorStop(1,"rgba(110,70,0,0)");c.fillStyle=q;c.fillRect(w[0],w[1],h[0],h[1])};
  rail(M,0,M+14,0,[M,M],[14,H]);rail(M+W,0,M+W-14,0,[M+W-14,M],[14,H]);
  rail(0,M,0,M+14,[M,M],[GL,14]);rail(0,M,0,M+14,[M+GR,M],[W-GR,14]);
  rail(0,M+H,0,M+H-14,[M,M+H-14],[GL,14]);rail(0,M+H,0,M+H-14,[M+GR,M+H-14],[W-GR,14]);
  c.fillStyle="#FF4F3A";c.fillRect(M+GL,M-3,GW,5);
  c.fillStyle="#3D5BFF";c.fillRect(M+GL,M+H-2,GW,5);
  for(const [px,py] of [[GL,0],[GR,0],[GL,H],[GR,H]]){
    c.beginPath();c.arc(M+px,M+py,POST,0,6.283);c.fillStyle="#FFF8D6";c.fill();c.lineWidth=2.5;c.strokeStyle="#171A52";c.stroke();
  }
}
function disc(x,y,r,c1,c2){
  cx.fillStyle="rgba(60,40,0,.3)";cx.beginPath();cx.ellipse(x+3,y+5,r,r*.95,0,0,6.283);cx.fill();
  const g=cx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();
}
function paddle(p,c1,c2){
  disc(p.x,p.y,KR,c1,c2);
  cx.lineWidth=3;cx.strokeStyle="#171A52";cx.beginPath();cx.arc(p.x,p.y,KR-1.5,0,6.283);cx.stroke();
  cx.strokeStyle="rgba(255,255,255,.4)";cx.lineWidth=2;cx.beginPath();cx.arc(p.x,p.y,KR*.72,0,6.283);cx.stroke();
  disc(p.x,p.y,KR*.42,c1,c2);
  cx.fillStyle="rgba(255,255,255,.55)";cx.beginPath();cx.arc(p.x-KR*.15,p.y-KR*.17,KR*.1,0,6.283);cx.fill();
}
function draw(dt){
  const s=cv.width/CW,pk=V.puck;
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  shake*=Math.pow(.004,dt);if(shake<.2)shake=0;
  cx.setTransform(s,0,0,s,(Math.random()-.5)*shake*s,(Math.random()-.5)*shake*s);
  cx.drawImage(stat,0,0,CW,CH);
  cx.translate(M,M);
  const sp=Math.hypot(pk.vx,pk.vy);
  if(sp>240)pk.tr.push({x:pk.x,y:pk.y});else if(pk.tr.length)pk.tr.shift();
  if(pk.tr.length>9)pk.tr.shift();
  pk.tr.forEach((t,i)=>{cx.fillStyle="rgba(23,26,82,"+(.05+i*.012)+")";cx.beginPath();cx.arc(t.x,t.y,PR*(.5+i*.05),0,6.283);cx.fill()});
  cx.globalAlpha=state==="serve"?clamp(1.3-timer,0,1):1;
  disc(pk.x,pk.y,PR,"#4A50B8","#0B0D2E");
  cx.strokeStyle="#FFD60A";cx.lineWidth=2.5;cx.beginPath();cx.arc(pk.x,pk.y,PR*.62,0,6.283);cx.stroke();
  cx.globalAlpha=1;
  paddle(V.opp,"#FF9A80","#E03A24");paddle(V.me,"#7C93FF","#2A3FD6");
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.l-=dt*2.2;
    if(q.l<=0){parts.splice(i,1);continue}
    cx.globalAlpha=q.l;cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x,q.y,2+q.l*3,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;
}
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000;last=t;
  if(!(dt>0))dt=1/60;if(dt>.05)dt=.05;
  if(mode==="guest")guestTick(dt);
  else if(state==="serve"||state==="play"){acc+=dt;let n=0;while(acc>=1/120&&n++<12){step(1/120);acc-=1/120;if(state!=="serve"&&state!=="play")break}}
  netBeat(performance.now());
  draw(dt);
}
function fit(){
  const w=stage.clientWidth,h=stage.clientHeight,k=Math.min((w-4)/CW,(h-4)/CH);
  if(!(k>0))return;
  const cw=Math.floor(CW*k),ch2=Math.round(cw*CH/CW),d=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=cw+"px";cv.style.height=ch2+"px";
  cv.width=Math.round(cw*d);cv.height=Math.round(cw*d*CH/CW);
  buildStatic();
}

/* ---------- input & UI ---------- */
function setTarget(e){
  const r=cv.getBoundingClientRect(),k=CW/r.width;
  inp.x=(e.clientX-r.left)*k-M;inp.y=(e.clientY-r.top)*k-M-(e.pointerType==="touch"?46*k:0);
}
addEventListener("pointermove",setTarget);
cv.addEventListener("pointerdown",e=>{setTarget(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="p"||k==="escape"){e.preventDefault();state==="paused"?resume():pause();return}
  if(k.startsWith("arrow")&&(state==="play"||state==="serve"))e.preventDefault();
  keys[k]=true;
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  level=b.dataset.l;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-checked",x===b));
}));
$("#start").onclick=()=>{snd(440,.08,"triangle",.1);$("#menuMsg").textContent="";setMode("solo");newGame()};
$("#friend").onclick=()=>{snd(440,.08,"triangle",.1);$("#menuMsg").textContent="";hostGame()};
$("#again").onclick=()=>{snd(440,.08,"triangle",.1);mode==="host"?hostStart():newGame()};
$("#change").onclick=()=>{if(mode==="solo"){state="menu";show("menu")}else leaveOnline()};
$("#resume").onclick=resume;
$("#quit").onclick=()=>{state="menu";show("menu")};
$("#pbtn").onclick=()=>state==="paused"?resume():pause();
$("#mbtn").onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?"Sound off":"Sound on";e.currentTarget.setAttribute("aria-pressed",muted)};

new ResizeObserver(fit).observe(stage);
fit();show("menu");
requestAnimationFrame(frame);
const jm=location.pathname.match(/\/h\/([A-Za-z0-9]{5})/)||location.search.match(/[?&]g=([A-Za-z0-9]{5})/);
if(jm)joinGame(jm[1].toUpperCase());
})();
</script>
