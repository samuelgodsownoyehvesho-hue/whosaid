<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="SRvzJ1DR95mQzphx0hjb26L1vPEqMHSRmSPcf63cusY">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Most Likely To: a free party game for friend groups. Read the question, argue, tap who it is. AI-written questions, 6 rounds, shareable results.">
<meta property="og:title" content="Most Likely To - party game">
<meta property="og:description" content="Free party game for friend groups. AI-written questions and a shareable results card.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://whosaid.vercel.app/">
<title>Most Likely To - Free Party Game for Friends</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFFC00;--k:#0b0b0b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--y);color:var(--k);font-family:Archivo,system-ui,sans-serif;font-weight:500}
#app{min-height:100%;max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1,h2,.big{font-family:"Archivo Black",Impact,sans-serif;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
h1{font-size:56px}
h2{font-size:34px}
.tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;margin-bottom:12px}
.sp{flex:1}
.btn{display:block;width:100%;border:0;background:var(--k);color:var(--y);font-family:"Archivo Black",Impact,sans-serif;font-size:18px;text-transform:uppercase;padding:18px;border-radius:14px;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--k);border:2.5px solid var(--k)}
.btn[disabled]{opacity:.25}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:18px;padding:16px;border:2.5px solid var(--k);border-radius:14px;background:#fff;color:var(--k);outline:0}
.add{width:64px;margin:0;font-size:28px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{background:var(--k);color:var(--y);padding:9px 14px;border-radius:99px;font-weight:700;font-size:15px;text-transform:capitalize}
.chip.off{background:transparent;color:var(--k);border:2px solid var(--k);padding:7px 12px}
.prog{display:flex;gap:4px;margin-bottom:22px}
.prog i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.18)}
.prog i.on{background:var(--k)}
.q{font-size:38px;margin:6px 0 24px}
.pick{background:#fff;border:2.5px solid var(--k);border-radius:14px;padding:17px 18px;font:inherit;font-weight:700;font-size:20px;text-align:left;margin-bottom:10px;color:var(--k);display:block;width:100%}
.pick:active,.pick.sel{background:var(--k);color:var(--y)}
.li{padding:14px 0;border-bottom:2px solid rgba(0,0,0,.15)}
.li small{display:block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:4px}
.li b{font-family:"Archivo Black",Impact,sans-serif;font-size:24px;text-transform:uppercase}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.err{font-size:13px;font-weight:700;margin-top:14px;color:#5a0000}
.chbox{width:100%;font:inherit;font-weight:700;font-size:16px;padding:14px 16px;border:2.5px solid var(--k);border-radius:14px;background:#fff;color:var(--k);outline:0;resize:none;margin-top:8px}
.fade{animation:f .35s ease both}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <h1>Most Likely To - Free Party Game for Friends</h1>
  <p>A free party game for friend groups. Read the question out loud, argue, and tap who it is. Play with 2 or more players.</p>
</div>
<noscript><h1>Most Likely To</h1><p>A free party game for friend groups. Read the question out loud, argue, and tap who it is. Six rounds of AI-written questions, then a shareable results card. Turn on JavaScript to play.</p></noscript>
<script>
const PROMPTS=[
"Most likely to leave someone on read for a week",
"Most likely to start a group chat and never text in it",
"Most likely to cry at a commercial",
"Most likely to show up late to their own birthday",
"Most likely to get famous for something dumb",
"Most likely to text their ex at 2am",
"Most likely to survive a zombie apocalypse",
"Most likely to forget everyone's birthday",
"Most likely to say 'I'm five minutes away' from their bed",
"Most likely to win an argument they started",
"Most likely to adopt six cats",
"Most likely to get lost with GPS on",
"Most likely to be on a reality show",
"Most likely to screenshot the chat and send it to someone else",
"Most likely to become a millionaire by accident",
"Most likely to fall asleep mid-movie",
"Most likely to overshare with a stranger",
"Most likely to quit their job dramatically",
"Most likely to have 4,000 unread messages",
"Most likely to bring a speaker to the park",
"Most likely to be secretly the funniest",
"Most likely to ghost the group chat"
];
const ROUNDS=6;
const API='/api/questions';
const MODES=['mixed','college','work','couples','roast','classic'];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={players:[],qs:[],src:'',err:'',mode:'mixed',adult:(function(){try{return localStorage.getItem('mlt_18')==='1'}catch(_){return false}})(),char:(function(){try{return localStorage.getItem('mlt_char')||''}catch(_){return ''}})(),i:0,picks:[],busy:false};

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function prog(){return `<div class="prog">${Array.from({length:ROUNDS},(_,k)=>`<i class="${k<=S.i?'on':''}"></i>`).join('')}</div>`}

function home(){
  const n=S.players.length;
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="tag">Party game · 2+ players</div>
    <h1 style="margin:14px 0 10px">Most<br>Likely<br>To</h1>
    <p style="max-width:300px;margin-bottom:26px">Read the question out loud. Argue. Tap who it is.</p>
    <div class="row"><input id="nm" maxlength="14" placeholder="Add a player" autocomplete="off"><button class="btn add" onclick="addP()">+</button></div>
    <div class="chips">${S.players.map((p,k)=>`<span class="chip" style="text-transform:none" onclick="rmP(${k})">${esc(p)} ×</span>`).join('')}</div>
    <div class="tag">Questions</div>
    <div class="chips" style="margin:10px 0 4px">${MODES.map(m=>`<span class="chip ${S.mode===m?'':'off'}" onclick="setMode('${m}')">${m}</span>`).join('')}</div>
    <div class="sp"></div>
    <div class="tag" style="margin-top:8px">AI character (optional)</div>
    <textarea id="ch" class="chbox" rows="2" maxlength="200" placeholder="e.g. a sarcastic Lagos bus conductor" oninput="setChar(this.value)">${esc(S.char)}</textarea>
    <div class="chips" style="margin:12px 0 0"><span class="chip ${S.adult?'':'off'}" style="text-transform:none" onclick="toggle18()">18+ mode ${S.adult?'on':'off'}</span></div>
    <a class="btn alt" style="text-align:center;text-decoration:none" href="/room.html">Play online with friends</a>
    <button class="btn" ${n<2?'disabled':''} onclick="start()">${n<2?`Need ${2-n} more`:'Start'}</button>
  </div>`;
  document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
}
function setChar(v){S.char=v;try{localStorage.setItem('mlt_char',v)}catch(_){}}
function toggle18(){
  if(S.adult){S.adult=false;try{localStorage.setItem('mlt_18','0')}catch(_){}return home()}
  if(confirm('18+ mode has adult humor. Are you 18 or older?')){S.adult=true;try{localStorage.setItem('mlt_18','1')}catch(_){}}
  home();
}
function setMode(m){S.mode=m;home()}
function addP(){
  const i=document.getElementById('nm');const v=i.value.trim();
  if(!v||S.players.length>=12||S.players.some(p=>p.toLowerCase()===v.toLowerCase()))return;
  S.players.push(v);home();document.getElementById('nm').focus();
}
function rmP(k){S.players.splice(k,1);home()}

function getHist(){try{return JSON.parse(localStorage.getItem('mlt_hist')||'[]')}catch(_){return []}}
function addHist(q){try{localStorage.setItem('mlt_hist',JSON.stringify(getHist().concat(q).slice(-60)))}catch(_){}}
async function aiPrompts(){
  S.err='';
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:S.mode,avoid:getHist(),character:S.char,adult:S.adult,names:S.players,n:10}),signal:ctl.signal});
    clearTimeout(t);
    const d=await res.json().catch(()=>({}));
    if(!res.ok){S.err=(d.error||'HTTP '+res.status)+(d.detail?': '+d.detail:'');return null}
    if(!Array.isArray(d.prompts)||d.prompts.length<ROUNDS){S.err='too few questions';return null}
    const out=d.prompts.slice(0,ROUNDS);addHist(out);return out;
  }catch(e){S.err=e.name==='AbortError'?'timeout':'network';return null}
}

async function start(){
  let q=null;
  if(S.mode!=='classic'){
    app.innerHTML='<div class="fade" style="display:flex;flex-direction:column;flex:1;justify-content:center"><div class="tag">Writing your questions</div><h2 style="margin-top:12px">One sec</h2></div>';
    q=await aiPrompts();
  }else S.err='';
  S.src=q?'ai':'local';
  S.qs=q||shuffle(PROMPTS).slice(0,ROUNDS);
  S.i=0;S.picks=[];S.busy=false;ask();
}

function ask(){
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span class="tag">${S.i+1} / ${ROUNDS}</span><span class="tag">${S.src==='ai'?'AI questions':'Built-in questions'}</span></div>
    ${prog()}
    <div class="big q">${esc(S.qs[S.i])}</div>
    ${S.players.map((p,k)=>`<button class="pick" id="p${k}" onclick="pick(${k})">${esc(p)}</button>`).join('')}
    ${S.err&&S.src!=='ai'?`<div class="err">AI failed: ${esc(S.err)}</div>`:''}
  </div>`;
}
function pick(k){
  if(S.busy)return;S.busy=true;S.picks.push(k);
  document.getElementById('p'+k).classList.add('sel');
  setTimeout(()=>{S.i++;S.busy=false;S.i>=ROUNDS?results():ask()},450);
}

function results(){
  const cnt=S.players.map((_,k)=>S.picks.filter(x=>x===k).length);
  const order=S.players.map((p,k)=>({p,c:cnt[k]})).filter(o=>o.c).sort((a,b)=>b.c-a.c);
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="tag">6 / 6 · Done</div>
    <h2 style="margin:12px 0 4px">The group<br>has spoken</h2>
    <div class="sum">${order.map(o=>`<span class="chip" style="text-transform:none">${esc(o.p)} · ${o.c}</span>`).join('')}</div>
    <div style="margin:8px 0 18px">${S.qs.map((q,n)=>`<div class="li"><small>${esc(q)}</small><b>${esc(S.players[S.picks[n]])}</b></div>`).join('')}</div>
    <div class="sp"></div>
    <button class="btn alt" onclick="share()">Share to story</button>
    <button class="btn" onclick="start()">Play again</button>
    <button class="btn alt" onclick="home()">Change players</button>
  </div>`;
}

function wrap(ctx,text,x,y,w,lh){
  let line='';
  for(const word of text.split(' ')){
    const t=line+word+' ';
    if(ctx.measureText(t).width>w&&line){ctx.fillText(line.trim(),x,y);line=word+' ';y+=lh}else line=t;
  }
  ctx.fillText(line.trim(),x,y);return y+lh;
}
async function share(){
  try{await document.fonts.load('70px "Archivo Black"');await document.fonts.load('700 34px Archivo')}catch(_){}
  const c=document.createElement('canvas');c.width=1080;c.height=1920;
  const x=c.getContext('2d');
  x.fillStyle='#FFFC00';x.fillRect(0,0,1080,1920);
  x.fillStyle='#0b0b0b';
  x.font='700 34px Archivo, sans-serif';x.fillText('THE GROUP HAS SPOKEN',90,160);
  let y=290;
  S.qs.forEach((q,n)=>{
    x.fillStyle='#0b0b0b';x.font='700 34px Archivo, sans-serif';
    const ny=wrap(x,q.toUpperCase(),90,y,900,44);
    const name=S.players[S.picks[n]].toUpperCase();
    let size=70;x.font=`${size}px "Archivo Black", Impact, sans-serif`;
    while(x.measureText(name).width>900&&size>34){size-=4;x.font=`${size}px "Archivo Black", Impact, sans-serif`}
    x.fillText(name,90,ny+34);
    y=ny+34+78;
  });
  x.fillStyle='#0b0b0b';x.font='700 30px Archivo, sans-serif';
  x.fillText('MOST LIKELY TO — PLAY WITH YOUR GROUP',90,1820);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'verdict.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]})}catch(_){}return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verdict.png';a.click();
}

home();
</script>
</body>
</html>
