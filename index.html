<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Most Likely To</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFFC00;--k:#0b0b0b;--g:#f2f2f2;--m:#6b6b6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--y);color:var(--k);font-family:Archivo,system-ui,sans-serif;font-weight:500}
#app{min-height:100%;max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1,h2,.big{font-family:"Archivo Black",Impact,sans-serif;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
h1{font-size:56px}
h2{font-size:34px}
.tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sp{flex:1}
.btn{display:block;width:100%;border:0;background:var(--k);color:var(--y);font:inherit;font-family:"Archivo Black",Impact,sans-serif;font-size:18px;text-transform:uppercase;padding:18px;border-radius:14px;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--k);border:2.5px solid var(--k)}
.btn[disabled]{opacity:.25}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:18px;padding:16px;border:2.5px solid var(--k);border-radius:14px;background:#fff;color:var(--k);outline:0}
.add{width:64px;margin:0;font-size:28px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{background:var(--k);color:var(--y);padding:9px 14px;border-radius:99px;font-weight:700;font-size:15px}
.prog{display:flex;gap:4px;margin-bottom:26px}
.prog i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.18)}
.prog i.on{background:var(--k)}
.q{font-size:38px;margin:10px 0 26px}
.pick{background:#fff;border:2.5px solid var(--k);border-radius:14px;padding:17px 18px;font:inherit;font-weight:700;font-size:19px;text-align:left;margin-bottom:10px;color:var(--k);display:block;width:100%}
.pick:active{background:var(--k);color:var(--y)}
.who{font-family:"Archivo Black",Impact,sans-serif;font-size:44px;text-transform:uppercase;line-height:1}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.bar b{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.bar span{height:14px;background:var(--k);border-radius:7px;min-width:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar em{font-style:normal;font-size:14px}
.win{background:var(--k);color:var(--y);border-radius:18px;padding:26px 22px;margin:8px 0 18px}
.win .tag{opacity:.7}
.list{margin-top:14px}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px solid rgba(0,0,0,.15);font-weight:700}
.li small{color:#3a3a00;font-weight:500}
.fade{animation:f .35s ease both}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROMPTS=[
"Most likely to leave someone on read for a week",
"Most likely to start a group chat and never text in it",
"Most likely to cry at a commercial",
"Most likely to show up late to their own birthday",
"Most likely to get famous for something dumb",
"Most likely to text their ex at 2am",
"Most likely to survive a zombie apocalypse",
"Most likely to forget everyone's birthday",
"Most likely to say 'I'm five minutes away' from their bed",
"Most likely to win an argument they started",
"Most likely to adopt six cats",
"Most likely to get lost with GPS on",
"Most likely to be on a reality show",
"Most likely to screenshot the chat and send it to someone else",
"Most likely to become a millionaire by accident",
"Most likely to fall asleep mid-movie",
"Most likely to overshare with a stranger",
"Most likely to quit their job dramatically",
"Most likely to have 4,000 unread messages",
"Most likely to bring a speaker to the park",
"Most likely to be secretly the funniest",
"Most likely to ghost the group chat"
];
const ROUNDS=8;
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={players:[],rounds:[],r:0,v:0,tally:[],log:[]};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function home(){
  const n=S.players.length;
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="tag">Party game · 3+ players</div>
    <h1 style="margin:14px 0 10px">Most<br>Likely<br>To</h1>
    <p style="max-width:300px;margin-bottom:26px">Pass the phone. Vote on your friends. Post the verdict.</p>
    <div class="row"><input id="nm" maxlength="14" placeholder="Add a player" autocomplete="off"><button class="btn add" onclick="addP()">+</button></div>
    <div class="chips">${S.players.map((p,i)=>`<span class="chip" onclick="rmP(${i})">${esc(p)} ×</span>`).join('')}</div>
    <div class="sp"></div>
    <button class="btn" ${n<3?'disabled':''} onclick="start()">${n<3?`Need ${3-n} more`:'Start'}</button>
  </div>`;
  const i=document.getElementById('nm');
  i.addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
}
function addP(){
  const i=document.getElementById('nm');const v=i.value.trim();
  if(!v||S.players.length>=10||S.players.some(p=>p.toLowerCase()===v.toLowerCase()))return;
  S.players.push(v);home();document.getElementById('nm').focus();
}
function rmP(i){S.players.splice(i,1);home()}

function start(){
  S.rounds=shuffle(PROMPTS).slice(0,ROUNDS);S.r=0;S.v=0;S.log=[];
  S.tally=S.players.map(()=>0);vote();
}
function prog(){return `<div class="prog">${S.rounds.map((_,i)=>`<i class="${i<=S.r?'on':''}"></i>`).join('')}</div>`}

function vote(){
  const voter=S.players[S.v];
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    ${prog()}
    <div class="tag">Round ${S.r+1} of ${S.rounds.length}</div>
    <div class="big q">${esc(S.rounds[S.r])}</div>
    <div class="tag" style="margin-bottom:12px">${esc(voter)}, your vote</div>
    ${S.players.map((p,i)=>i===S.v?'':`<button class="pick" onclick="cast(${i})">${esc(p)}</button>`).join('')}
  </div>`;
}
function cast(i){
  S.tally[i]++;S.v++;
  if(S.v>=S.players.length)reveal();else vote();
}

function reveal(){
  const max=Math.max(...S.tally);
  const winners=S.players.filter((_,i)=>S.tally[i]===max);
  const entry={prompt:S.rounds[S.r],winners,tally:S.tally.slice()};
  S.log.push(entry);
  const last=S.r===S.rounds.length-1;
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    ${prog()}
    <div class="win">
      <div class="tag">${esc(entry.prompt)}</div>
      <div class="who" style="margin-top:14px">${winners.map(esc).join(' &amp; ')}</div>
    </div>
    ${S.players.map((p,i)=>`<div class="bar"><b>${esc(p)}</b><span style="width:0" data-w="${max?S.tally[i]/max*100:0}"></span><em>${S.tally[i]}</em></div>`).join('')}
    <div class="sp"></div>
    <button class="btn alt" onclick="share(${S.log.length-1})">Share to story</button>
    <button class="btn" onclick="${last?'final()':'next()'}">${last?'Final results':'Next round'}</button>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.bar span').forEach(s=>s.style.width=`calc((100% - 150px) * ${s.dataset.w/100})`);
  }));
}
function next(){S.r++;S.v=0;S.tally=S.players.map(()=>0);vote()}

function final(){
  const wins=S.players.map(p=>S.log.filter(l=>l.winners.includes(p)).length);
  const order=S.players.map((p,i)=>({p,w:wins[i]})).sort((a,b)=>b.w-a.w);
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1">
    <div class="tag">Final standings</div>
    <h2 style="margin:12px 0 6px">${esc(order[0].p)}<br>runs this group</h2>
    <div class="list">${order.map(o=>`<div class="li"><span>${esc(o.p)}</span><small>${o.w} title${o.w===1?'':'s'}</small></div>`).join('')}</div>
    <div class="sp"></div>
    <button class="btn alt" onclick="share(${S.log.findIndex(l=>l.winners.includes(order[0].p))})">Share top title</button>
    <button class="btn" onclick="start()">Play again</button>
    <button class="btn alt" onclick="home()">Change players</button>
  </div>`;
}

function wrap(ctx,text,x,y,w,lh){
  const words=text.split(' ');let line='';
  for(const word of words){
    const t=line+word+' ';
    if(ctx.measureText(t).width>w&&line){ctx.fillText(line.trim(),x,y);line=word+' ';y+=lh}else line=t;
  }
  ctx.fillText(line.trim(),x,y);return y+lh;
}
async function share(idx){
  const e=S.log[idx];
  const c=document.createElement('canvas');c.width=1080;c.height=1920;
  const x=c.getContext('2d');
  x.fillStyle='#FFFC00';x.fillRect(0,0,1080,1920);
  x.fillStyle='#0b0b0b';x.textBaseline='alphabetic';
  x.font='700 34px Archivo, sans-serif';x.fillText('THE GROUP HAS SPOKEN',90,200);
  x.font='64px "Archivo Black", Impact, sans-serif';
  let y=wrap(x,e.prompt.toUpperCase(),90,560,900,76);
  x.fillStyle='#0b0b0b';x.fillRect(90,y+40,900,420);
  x.fillStyle='#FFFC00';
  const name=e.winners.join(' & ').toUpperCase();
  let size=130;x.font=`${size}px "Archivo Black", Impact, sans-serif`;
  while(x.measureText(name).width>820&&size>48){size-=6;x.font=`${size}px "Archivo Black", Impact, sans-serif`}
  x.fillText(name,130,y+40+250);
  x.fillStyle='#0b0b0b';x.font='700 30px Archivo, sans-serif';
  x.fillText('MOST LIKELY TO — PLAY WITH YOUR GROUP',90,1780);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'verdict.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(_){return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verdict.png';a.click();
}

/* Snap Minis hook: when the SDK is wired in, replace S.players with the
   user's selected friends (display names / Bitmoji) before calling start(). */

home();
</script>
</body>
</html>
